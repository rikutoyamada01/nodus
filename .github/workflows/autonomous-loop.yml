name: Autonomous Mining & Closed-Loop SEO Engine

on:
  schedule:
    # Runs daily at 06:00 JST (21:00 UTC)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      analytics_only:
        description: "Fetch analytics without mining, SEO edits or deployment"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nodus-autonomous-loop
  cancel-in-progress: false

jobs:
  analytics:
    name: Collect actual analytics (no sample fallback)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify analytics handling
        run: python -m unittest discover -s scripts -p test_analytics_report.py
      - name: Fetch Cloudflare and Search Console metrics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GSC_ACCESS_TOKEN: ${{ secrets.GSC_ACCESS_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python scripts/analytics_report.py
      - name: Preserve report even if authentication is missing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: analytics-report
          path: data/analytics/latest.json
          retention-days: 30
          if-no-files-found: warn

  autonomous-loop:
    name: Mine Quantitative Logs & Optimize SEO
    if: github.ref == 'refs/heads/main' && inputs.analytics_only != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (main branch only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Mine community empirical benchmarks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python scripts/miner.py --all-configured

      - name: Refresh real-time search word trends & intent radar
        run: python scripts/trend_radar.py --fast

      - name: Execute Closed-Loop SEO Optimizer (Live GSC when configured)
        env:
          GSC_ACCESS_TOKEN: ${{ secrets.GSC_ACCESS_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: |
          if [ -n "$GSC_ACCESS_TOKEN" ] || { [ -n "$GSC_CLIENT_ID" ] && [ -n "$GSC_CLIENT_SECRET" ] && [ -n "$GSC_REFRESH_TOKEN" ]; }; then
            python scripts/seo_loop.py --apply || {
              rc=$?
              if [ "$rc" -eq 2 ]; then
                echo "::warning::Live GSC telemetry unavailable (exit 2); skipping SEO article rewrites and continuing pipeline."
              else
                exit "$rc"
              fi
            }
          else
            echo "::warning::Search Console credentials are missing. SEO changes were skipped; no sample data was used."
          fi

      - name: Rebuild static site & CSV datasets
        run: python scripts/build_site.py

      - name: Enforce Enterprise Validation Gate before commit
        run: python scripts/validate_site.py

      - name: Commit and push verified updates
        id: commit_updates
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "nodus-autonomous-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ content/ dist/
          if git diff --cached --quiet -- dist/; then
            echo "dist_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "dist_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --cached --quiet; then
            echo "No verified data or SEO changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(autonomous): update mined quantitative logs and rebuild dist"
            git push origin HEAD:main
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy updated dist to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && steps.commit_updates.outputs.dist_changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx --yes wrangler@4.86.0 pages deploy dist --project-name=nodus-lab --branch=main
          else
            echo "Cloudflare secrets not set; skipping deploy."
          fi

      - name: Ping IndexNow & Search Console for instant indexing
        if: github.ref == 'refs/heads/main' && steps.commit_updates.outputs.dist_changed == 'true'
        env:
          GSC_ACCESS_TOKEN: ${{ secrets.GSC_ACCESS_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: |
          sleep 3
          python scripts/ping_index.py || true
