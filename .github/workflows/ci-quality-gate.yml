name: CI Quality Gate & Cloudflare Pages Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  deployments: write

jobs:
  validate-and-build:
    name: Build & Enterprise Security/Legal Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Build static site and CSV datasets
        run: python scripts/build_site.py

      - name: Run security, legal, CSP, and A11y validation gate
        run: python scripts/validate_site.py

      - name: Verify SEO closed-loop dry-run
        run: python scripts/seo_loop.py

      - name: Deploy to Cloudflare Pages (when secrets are configured)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=nodus-lab --branch=main
